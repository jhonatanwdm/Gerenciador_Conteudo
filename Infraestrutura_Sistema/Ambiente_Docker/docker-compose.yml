version: '3.8'

services:
  banco_postgresql:
    image: postgres:16-alpine
    container_name: gerenciador_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gerenciador_conteudo
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data

  fila_redis:
    image: redis:7-alpine
    container_name: gerenciador_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dados_redis:/data

  armazenamento_minio:
    image: minio/minio:latest
    container_name: gerenciador_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dados_minio:/data

volumes:
  dados_postgres:
  dados_redis:
  dados_minio:
